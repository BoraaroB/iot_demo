name: iiot

networks:
  iiot-network:
    driver: bridge

services:
  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    container_name: iiot-kafka
    restart: unless-stopped
    ports:
      - '${KAFKA_PORT:-9092}:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_LISTENERS: 'CONTROLLER://:29093,PLAINTEXT_HOST://:9092,PLAINTEXT://:19092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT_HOST://localhost:9092,PLAINTEXT://kafka:19092'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: '4L6g3nShT-eMCtK--X86sw'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      # Topics are created explicitly by `kafka-init` so partition counts are deliberate
      # and a misspelled topic name fails loudly instead of silently creating a new topic.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    volumes:
      - ./.data/kafka:/tmp/kraft-combined-logs
    healthcheck:
      test:
        [
          'CMD',
          '/opt/kafka/bin/kafka-broker-api-versions.sh',
          '--bootstrap-server',
          'localhost:9092',
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - iiot-network

  # One-shot: creates the platform topics once the broker is healthy, then exits 0.
  kafka-init:
    image: apache/kafka:4.3.1
    container_name: iiot-kafka-init
    restart: 'no'
    entrypoint: ['/bin/bash', '/scripts/create-topics.sh']
    environment:
      KAFKA_BOOTSTRAP_SERVER: kafka:19092
    volumes:
      - ./infrastructure/kafka/create-topics.sh:/scripts/create-topics.sh:ro
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - iiot-network

  postgres:
    image: postgres:18-alpine
    hostname: postgres
    container_name: iiot-postgres
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iiot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_dev_only}
      POSTGRES_DB: vehicle_db
    volumes:
      - ./.data/postgres:/var/lib/postgresql
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d vehicle_db']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - iiot-network

  timescaledb:
    image: timescale/timescaledb:2.24.0-pg18-oss
    hostname: timescaledb
    container_name: iiot-timescaledb
    restart: unless-stopped
    ports:
      - '${TIMESCALEDB_PORT:-5434}:5432'
    environment:
      POSTGRES_USER: ${TIMESCALEDB_USER:-iiot}
      POSTGRES_PASSWORD: ${TIMESCALEDB_PASSWORD:-changeme_dev_only}
      POSTGRES_DB: telemetry_db
    volumes:
      - ./.data/timescaledb:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d telemetry_db']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - iiot-network

  redis:
    image: redis:8-alpine
    hostname: redis
    container_name: iiot-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6380}:6379'
    volumes:
      - ./.data/redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - iiot-network

  emqx:
    image: emqx/emqx:5.10.5
    hostname: emqx
    container_name: iiot-emqx
    restart: unless-stopped
    ports:
      - '${EMQX_MQTT_PORT:-1883}:1883'
      - '${EMQX_DASHBOARD_PORT:-18083}:18083'
    environment:
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD:-changeme_dev_only}
    volumes:
      - ./.data/emqx:/opt/emqx/data
    healthcheck:
      test: ['CMD', '/opt/emqx/bin/emqx', 'ctl', 'status']
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - iiot-network

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    hostname: kafka-ui
    container_name: iiot-kafka-ui
    restart: unless-stopped
    ports:
      - '${KAFKA_UI_PORT:-8080}:8080'
    environment:
      KAFKA_CLUSTERS_0_NAME: iiot
      KAFKA_CLUSTERS_0_BOOTSTRAP-SERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:8080/']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - iiot-network
